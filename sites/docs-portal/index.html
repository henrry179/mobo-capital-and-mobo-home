<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>莫伯双站 · 工程文档站</title>
  <style>
    :root {
      --bg: #0b1220;
      --line: #1e2a44;
      --text: #e8eefc;
      --muted: #8b9bb8;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: radial-gradient(900px 480px at 0% 0%, #152238, transparent), var(--bg);
    }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: rgba(16,24,39,.9);
      position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px);
    }
    .top h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
    .top .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .top nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .top a {
      color: var(--muted); text-decoration: none; font-size: 12px;
      border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px;
    }
    .top a:hover { color: var(--text); border-color: var(--gold); }
    .wrap { padding: 16px 18px 40px; max-width: 1280px; margin: 0 auto; }
    .note { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>莫伯双站 · 工程文档站</h1>
      <div class="meta">精选公开说明书 · Markdown / Word · 与门户业务 JSON 分轨</div>
    </div>
    <nav>
      <a href="../../">入口</a>
      <a href="../mobocapital/">资本</a>
      <a href="../mobohome/">之家</a>
      <a href="../../services/console/">控制台</a>
    </nav>
  </header>
  <div class="wrap">
    <p class="note">与资本 / 之家 / 控制台共用同一套目录与阅读器。亦可在各站顶栏「工程文档」内页阅读。</p>
    <div id="docs-pane-root"></div>
  </div>
  <script src="../shared/doc-viewer.js"></script>
  <script src="../shared/docs-pane.js"></script>
  <script>
    (function () {
      var root = document.getElementById('docs-pane-root');
      if (!root || !window.MoBoDocsPane) return;
      var q = new URL(location.href).searchParams.get('doc');
      MoBoDocsPane.mount(root, {
        catalogUrl: './catalog.json',
        repoBase: '../../',
        defaultId: q || 'zongce',
        height: 'calc(100vh - 120px)'
      });
    })();
  </script>
</body>
</html>
