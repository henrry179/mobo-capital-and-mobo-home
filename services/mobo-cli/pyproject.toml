[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobo-cli"
version = "0.1.0"
description = "莫伯双站 · 网站 B 数据录入 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MoBo" }]
dependencies = [
    "numpy>=1.26",
    "psycopg2-binary>=2.9,<3",
    "oss2>=2.18,<3",
    "Pillow>=10,<12",
    "pypdf>=4,<6",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1", "python-docx>=1.1,<2"]

[project.scripts]
mobo-cli = "mobo_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mobo_cli*", "collectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
