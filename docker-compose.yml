# =============================================================================
# 莫伯双站系统（MoBoCapital.com / MoBoHome.com）· 单机六容器编排 v2.1
# 运行目录：/opt/mobo-stack（项目根目录）
# 依赖：.env（chmod 600）、deploy/、services/、sites/
#
# 红线一：2C4G 内存硬限流 —— 六个容器 mem_limit 合计 1.84GB
#         （caddy 80 + postgres 600 + siyuan 300 + n8n 512 + dashboard 200 + restic 150）
#         本地实测常驻约 636MiB；2C4G 云端目标 ≤1.2GB，宿主机另配 4GB Swap（vm.swappiness=10）
#         注：n8n 启动迁移期 V8 堆峰值约 300MB，故取 512MB 限额 + 400MB 堆上限
# 网络分层：edge_net(Caddy 公网) / internal_net(internal:true) / egress_net(仅出网)
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-mobo-stack}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 统一网关：双主站 HTTPS / BasicAuth / 静态分发 / 反代
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.9-alpine
    container_name: mobo-caddy
    restart: unless-stopped
    mem_limit: 80m
    memswap_limit: 120m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TZ: ${TZ}
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN_CAPITAL: ${DOMAIN_CAPITAL}
      DOMAIN_HOME: ${DOMAIN_HOME}
      DOMAIN_PKM: ${DOMAIN_PKM}
      DOMAIN_N8N: ${DOMAIN_N8N}
      DOMAIN_ADMIN: ${DOMAIN_ADMIN}
      DOMAIN_LAB: ${DOMAIN_LAB}
      CADDY_ADMIN_USER: ${CADDY_ADMIN_USER}
      CADDY_ADMIN_PASSWORD_HASH: ${CADDY_ADMIN_PASSWORD_HASH}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/volumes/caddy_data:/data
      - ./deploy/volumes/caddy_config:/config
      - ./deploy/volumes/caddy_logs:/var/log/caddy
      # 双站静态门户（只读分发，服务端 0 额外内存）
      - ./sites/mobocapital:/srv/sites/mobocapital:ro
      - ./sites/mobohome:/srv/sites/mobohome:ro
      # 静态操作台
      - ./services/console:/srv/console:ro
    networks:
      - edge_net
      - internal_net
    depends_on:
      - mobobrain-pkm
      - mobobrain-n8n
      - archive-dashboard
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 数据底座：PostgreSQL 16 + pgvector，单实例双库三 Schema
  #   db_mobobrain : intel(采集/发布) + capital(投研/基金/终端) + n8n
  #   db_archive   : archive(个人档案)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mobo-postgres
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 800m
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${PG_SUPER_USER}
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD}
      POSTGRES_DB: postgres
      # PGDATA 指向挂载点下的子目录：避免 initdb 报 "not empty / lost+found"
      PGDATA: /var/lib/postgresql/data/pgdata
      # initdb/01-init-dual-db.sql 通过 \getenv 读取（角色与库名）
      PG_DB_MOBOBRAIN: ${PG_DB_MOBOBRAIN}
      PG_USER_MOBOBRAIN: ${PG_USER_MOBOBRAIN}
      PG_PASS_MOBOBRAIN: ${PG_PASS_MOBOBRAIN}
      PG_DB_ARCHIVE: ${PG_DB_ARCHIVE}
      PG_USER_ARCHIVE: ${PG_USER_ARCHIVE}
      PG_PASS_ARCHIVE: ${PG_PASS_ARCHIVE}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "timezone=Asia/Shanghai"
    volumes:
      - ./deploy/volumes/pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPER_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 网站 A：思源笔记（《MoBo's Memo》投研母本与创作源头）
  # ---------------------------------------------------------------------------
  mobobrain-pkm:
    image: b3log/siyuan:latest
    container_name: mobobrain-pkm
    restart: unless-stopped
    mem_limit: 300m
    memswap_limit: 450m
    # 思源 v3.8+ 内核为 CLI 形态：需显式给出 serve 子命令
    command:
      - "serve"
      - "--accessAuthCode=${SIYUAN_ACCESS_AUTH_CODE}"
      - "--port=6806"
    volumes:
      - ./deploy/volumes/mobobrain_data:/siyuan/workspace
    networks:
      - internal_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 网站 A：n8n 自动化（工作流 #1 RSS 提纯 / 工作流 #2 1+3 四端发布）
  # ---------------------------------------------------------------------------
  mobobrain-n8n:
    image: n8nio/n8n:latest
    container_name: mobobrain-n8n
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 700m
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PG_DB_MOBOBRAIN}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMAIN_N8N}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${DOMAIN_N8N}/
      N8N_PROXY_HOPS: 1
      N8N_LOG_LEVEL: info
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # 350MB 红线：强制主进程执行，禁用 queue/worker
      EXECUTIONS_PROCESS: main
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # 启动迁移阶段 V8 堆峰值约 300MB，留 400MB 上限 + cgroup 512MB
      NODE_OPTIONS: "--max-old-space-size=400"
      # Code 节点允许使用 crypto（url_hash/规范化）
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      # 微信草稿箱直推（工作流 #2）
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_DEFAULT_THUMB_MEDIA_ID: ${WECHAT_DEFAULT_THUMB_MEDIA_ID}
    volumes:
      - ./deploy/volumes/n8n_data:/home/node/.n8n
      # 发布流落盘母本与静态目录（可写）
      - ./sites/mobocapital:/data/mobocapital
    networks:
      - internal_net
      - egress_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 网站 B：Streamlit 生命体征 Z-Score / Lead-Lag 实验室
  # ---------------------------------------------------------------------------
  archive-dashboard:
    build:
      context: ./services/archive-dashboard
      dockerfile: Dockerfile
    container_name: archive-dashboard
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 300m
    environment:
      TZ: ${TZ}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB_ARCHIVE: ${PG_DB_ARCHIVE}
      PG_USER_ARCHIVE: ${DASHBOARD_DB_USER}
      PG_PASS_ARCHIVE: ${DASHBOARD_DB_PASSWORD}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_PRIVATE}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_REGION: ${OSS_REGION}
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_ENABLE_CORS: "true"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
    networks:
      - internal_net
      - egress_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 每日 03:00：pg_dump 双库 + 数据卷 + 配置 -> Restic -> OSS
  # ---------------------------------------------------------------------------
  restic-backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    container_name: mobo-restic-backup
    restart: unless-stopped
    mem_limit: 150m
    memswap_limit: 250m
    environment:
      TZ: ${TZ}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PG_SUPER_USER}
      PGPASSWORD: ${PG_SUPER_PASSWORD}
      PG_DB_MOBOBRAIN: ${PG_DB_MOBOBRAIN}
      PG_DB_ARCHIVE: ${PG_DB_ARCHIVE}
      AWS_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${ALIYUN_ACCESS_KEY_SECRET}
      AWS_DEFAULT_REGION: ${OSS_REGION}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START}
      BACKUP_STAGING_DIR: /backup
      SIYUAN_DATA_DIR: /data/mobobrain_data
      N8N_DATA_DIR: /data/n8n_data
      CONFIG_DIR: /data/config
    volumes:
      - ./deploy/volumes/backup_staging:/backup
      - ./deploy/volumes/mobobrain_data:/data/mobobrain_data:ro
      - ./deploy/volumes/n8n_data:/data/n8n_data:ro
      - ./deploy/caddy:/data/config/caddy:ro
      - ./deploy/backup:/data/config/backup:ro
      - ./deploy/postgres/initdb:/data/config/initdb:ro
      - ./docker-compose.yml:/data/config/docker-compose.yml:ro
    networks:
      - internal_net
      - egress_net
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge
